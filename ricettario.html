// ingredienti contati a pezzi (quantità in ricetta = numero di pezzi)
const PZ = /^(impasto|impasto_pala|impasto_torta|piadina|pane_.*|uovo|torta_testo|carne_.*|hamburger_pollo_150|cotoletta_pollo|petto_pollo|burrata|wurstel_90|bufala|jalapeno_.*|fiori_zucca|alette_pollo|chele_granchio|crocchette|roll_piccanti|polpette_cheddar|corn_hog|olive_ascolane|mozzarelline|suppli|cheesecake|semifreddo_.*|crema_catalana|panna_cotta|tartufo_gelato|tiramisu|tortino_cioccolato|acqua_.*|coca_033|fanta_033|sprite_033|the_bottiglia|engel_radler|birra_gluten_free|tennents_super|refosco_.*|ribolla_.*|sauvignon_.*|traminer_.*)$/;
const LITRI = /^(spina_.*|prosecco)$/;
const CLASSE_A = /^(spina_.*|mozzarella|impasto|impasto_pala|pomodoro|carne_.*|hamburger_pollo_150|salsiccia|prosciutto_crudo|bufala|stracciatella|burrata|patatine)$/;
const CLASSE_B = /^(bacon|cheddar|salame_piccante|speck|prosciutto_cotto|bresaola|mortadella.*|lardo|salmone|gamberetti|sella_san_venanzo|gorgonzola|salsa_4_formaggi|provola|funghi|porcini|verdure_grigliate|wurstel.*|patatine_chips|patate_dippers|mozzarelline|olive_ascolane|crocchette|alette_pollo|chele_granchio|jalapeno_.*|olio|cotoletta_pollo|pane_burger|impasto_torta|piadina|torta_testo|cheesecake|tiramisu|semifreddo_.*|prosecco|acqua_.*|coca_033|fanta_033|sprite_033|the_bottiglia|engel_radler|birra_gluten_free|tennents_super|refosco_.*|ribolla_.*|sauvignon_.*|traminer_.*|caffe)$/;

const KEY = "galleon_ricettario";
const salva = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const nuovoIng = n => ({u: PZ.test(n) ? "pz" : LITRI.test(n) ? "l" : "kg", classe: CLASSE_A.test(n) ? "A" : CLASSE_B.test(n) ? "B" : "C", costo: n === "impasto" ? 0.8 : null});
const slug = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, "");

function iniziale() {
  const st = {cats: [], ingr: {}};
  for (const [cat, {base, p}] of Object.entries(MENU)) {
    const c = {nome: cat, prodotti: []};
    for (const riga of p.split("\n")) {
      const [nome, prezzo, ing = ""] = riga.split("|");
      const voci = (base ? base.split(",") : []).concat(ing.split(",").filter(Boolean));
      const togli = voci.filter(v => v.startsWith("-")).map(v => v.slice(1));
      const lista = [];
      for (const v of voci) {
        if (v.startsWith("-")) continue;
        const [n, q] = v.split(":");
        if (togli.includes(n) || lista.some(x => x.n === n)) continue;
        if (!st.ingr[n]) st.ingr[n] = nuovoIng(n);
        lista.push({n, q: q ? +q : st.ingr[n].u === "pz" ? 1 : null});
      }
      c.prodotti.push({nome, prezzo: +prezzo, codice: slug(nome), ing: lista, note: ""});
    }
    st.cats.push(c);
  }
  return st;
}

let S;
try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
if (!S || !S.cats) S = iniziale();
else { // aggiunge le categorie nuove (es. bevande) senza toccare le modifiche già fatte
  const base = iniziale();
  base.cats.forEach(c => { if (!S.cats.some(x => x.nome === c.nome)) { S.cats.push(c);
    c.prodotti.forEach(p => p.ing.forEach(r => { if (!S.ingr[r.n]) S.ingr[r.n] = base.ingr[r.n]; })); } });
}

/* ===== utilità ===== */
const $ = id => document.getElementById(id);
const IT = (x, d = 2) => x == null || isNaN(x) ? "–" : new Intl.NumberFormat("it-IT", {maximumFractionDigits: d}).format(x);
const eur = x => x == null || isNaN(x) ? "–" : "€ " + IT(x, 2);
const num = v => { if (typeof v === "number") return v; if (v == null) return NaN; const s = String(v).trim().replace(/\s/g, "");
  return parseFloat(/,\d{1,3}$/.test(s) || (s.includes(",") && !s.includes(".")) ? s.replace(/\./g, "").replace(",", ".") : s.replace(/,/g, "")); };
const norm = s => slug(String(s ?? ""));
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const qtaStd = (r) => r.q == null ? null : (S.ingr[r.n]?.u === "pz" ? r.q : r.q / 1000); // in unità dell'ingrediente
function costoProdotto(p) {
  let tot = 0, manca = 0;
  for (const r of p.ing) { const c = S.ingr[r.n]?.costo, q = qtaStd(r); if (c == null || q == null) manca++; else tot += c * q; }
  return {tot, manca};
}

/* ===== VISTA RICETTARIO ===== */
let catSel = 0, aperti = new Set(), cerca = "";
function vistaRicettario() {
  const c = S.cats[catSel] || S.cats[0];
  const filtro = p => !cerca || norm(p.nome).includes(norm(cerca)) || p.ing.some(r => r.n.includes(norm(cerca)));
  const prodotti = cerca ? S.cats.flatMap((cc, ci) => cc.prodotti.map((p, pi) => ({p, ci, pi}))).filter(x => filtro(x.p))
                         : c.prodotti.map((p, pi) => ({p, ci: catSel, pi}));
  return `<div class="card"><div class="top"><input id="cerca" placeholder="🔍 Cerca prodotto o ingrediente" value="${esc(cerca)}" oninput="cerca=this.value;mostra(true)" style="flex:1;min-width:200px">

  return `<div style="overflow-x:auto"><table class="tabf"><tr><th>Prodotto in fattura</th><th class="n">Quantità</th><th class="n">€ totale</th><th>Ingrediente</th><th class="n">Fattore</th><th class="n">Costo per unità</th></tr>
   ${G.map((x, i) => { const u = S.ingr[x.n]?.u || ""; const c = x.n && x.f ? x.eur / (x.q * x.f) : null;
     return `<tr><td>${esc(x.desc)}<br><small class="mut">${esc(x.forn)}</small></td><td class="n">${IT(x.q)} ${esc(x.um)}</td><td class="n">${eur(x.eur)}</td>
     <td><input list="ingrlist" value="${x.n}" placeholder="(ignora)" style="width:150px" onchange="mappa(${i},'n',this.value)"></td>
     <td class="n"><input style="width:65px;text-align:right" value="${x.n ? IT(x.f, 3) : ""}" onchange="mappa(${i},'f',this.value)"></td>
     <td class="n"><b>${c == null ? "–" : eur(c) + "/" + u}</b></td></tr>`; }).join("")}</table></div>
   <datalist id="ingrlist">${Object.keys(S.ingr).sort().map(n => `<option value="${n}">`).join("")}</datalist>
   <p><button class="b p" onclick="applicaCosti()">Applica i costi agli ingredienti</button> <span class="mut">Se più righe vanno sullo stesso ingrediente, si fa la media pesata.</span></p>`;
}
function mappa(i, campo, v) {
  const x = window._gruppi[i], m = S.mappa[x.k] = S.mappa[x.k] || {n: x.n, f: x.f};
  if (campo === "n") { const n = norm(v); m.n = n; if (n && !S.ingr[n]) S.ingr[n] = nuovoIng(n); m.f = n ? fattore(x.desc, x.um, n) : 1; }
  else m.f = num(v) || 1;
  salva(); mostra();
}
function acquistiDaFatture() {
  const o = {}; gruppiFatture().forEach(x => { if (x.n) o[x.n] = (o[x.n] || 0) + x.q * x.f; }); return o;
}
function applicaCosti() {
  const agg = {}; gruppiFatture().forEach(x => { if (!x.n) return; S.mappa[x.k] = {n: x.n, f: x.f}; const a = agg[x.n] = agg[x.n] || {e: 0, q: 0}; a.e += x.eur; a.q += x.q * x.f; });
  const fatti = Object.entries(agg).filter(([, a]) => a.q > 0).map(([n, a]) => { S.ingr[n].costo = Math.round(a.e / a.q * 1000) / 1000; return `${n.replace(/_/g, " ")}: ${eur(S.ingr[n].costo)}/${S.ingr[n].u}`; });
  salva(); alert(fatti.length ? "Costi aggiornati:\n" + fatti.join("\n") : "Nessun ingrediente collegato."); mostra();
}
function selCol(id, campo, facolt) {
  const f = F[id];
  return `<select onchange="F['${id}'].${campo}=this.value;mostra()">${facolt ? `<option value="">(nessuna)</option>` : ""}${f.colonne.map(c => `<option ${c === f[campo] ? "selected" : ""}>${esc(c)}</option>`).join("")}</select>`;
}
async function carica(id, file) {
  if (!file) return;
  try {
    const buf = await file.arrayBuffer();
    let wb;
    if (/\.(csv|txt)$/i.test(file.name)) {
      const testo = new TextDecoder("utf-8").decode(buf), sep = (testo.split("\n")[0].match(/;/g) || []).length >= (testo.split("\n")[0].match(/,/g) || []).length ? ";" : ",";
      wb = XLSX.read(testo, {type: "string", FS: sep, raw: true});
    } else wb = XLSX.read(buf, {type: "array"});
    const ws = wb.Sheets[wb.SheetNames[0]];
    const righe = XLSX.utils.sheet_to_json(ws, {defval: "", raw: true});
    if (!righe.length) throw new Error("il file è vuoto");
    const colonne = Object.keys(righe[0]);
    const trova = rx => colonne.find(c => rx.test(norm(c)));
    const s = SLOT[id];
    F[id] = {nome: file.name, righe, colonne,
      k: (id === "vendite" || id === "ricette" ? trova(/^(descr|prodott|articol|nome)/) || trova(/cod/) : trova(/ingred|prodott|articol|descr/)) || colonne[0],
      q: (id === "ricette" ? trova(/gramm|^q|quant|^g$/) : trova(/^q|quant|pezz|venduti|kg/)) || colonne[1] || colonne[0],
      c: id === "ricette" ? trova(/categ/) || "" : "", p: id === "ricette" ? trova(/prezz/) || "" : "",
      i: id === "ricette" ? trova(/ingred/) || colonne[1] : null,
      e: trova(/import|totale|imponib|valore|euro|incass|costo_tot/) || "", h: trova(/orari|tariff/) || ""};
    if (id === "acquisti") F[id].c = trova(/categ|tipo/) || "";
    if (id === "costi") F[id].e = F[id].e || colonne[1] || colonne[0];
    if (id === "ricette") F[id].q = trova(/gramm|quant|^g$/) || colonne[2];
  } catch (e) { alert("Non riesco a leggere il file: " + e.message); }
  mostra();
}
function mappaProdotti() {
  const m = {}; S.cats.forEach(c => c.prodotti.forEach(p => { m[norm(p.nome)] = p; if (p.codice) m[norm(p.codice)] = p; }));
  return m;
}
function avvisoVendite() {
  const f = F.vendite, m = mappaProdotti();
  const non = [...new Set(f.righe.map(r => r[f.k]).filter(v => v !== "" && !m[norm(v)]))];
  return non.length ? `<p class="warn">${non.length} prodotti non trovati nel ricettario (contano zero): ${non.slice(0, 12).map(esc).join(", ")}${non.length > 12 ? "…" : ""}.
    Correggi il nome o il "codice cassa" nel ricettario. Bevande e coperti si possono ignorare.</p>` : `<p class="mut">✓ Tutti i prodotti trovati nel ricettario.</p>`;
}
function somma(id) {
  const f = F[id], o = {};
  if (!f) return o;
  f.righe.forEach(r => { const n = norm(r[f.k]), q = num(r[f.q]); if (n && !isNaN(q)) o[n] = (o[n] || 0) + q; });
  return o;
}
function importaRicette() {
  const f = F.ricette, m = mappaProdotti(), nuovi = {};
  f.righe.forEach(r => {
    const nome = String(r[f.k]).trim(), ing = norm(r[f.i]); if (!nome || !ing) return;
    (nuovi[nome] = nuovi[nome] || {cat: f.c ? String(r[f.c]).trim() : "", prezzo: f.p ? num(r[f.p]) : NaN, ing: []}).ing.push({n: ing, q: isNaN(num(r[f.q])) ? null : num(r[f.q])});
  });
  let agg = 0, cre = 0;
  for (const [nome, x] of Object.entries(nuovi)) {
    x.ing.forEach(r => { if (!S.ingr[r.n]) S.ingr[r.n] = nuovoIng(r.n); });
    const p = m[norm(nome)];
    if (p) { p.ing = x.ing; if (!isNaN(x.prezzo)) p.prezzo = x.prezzo; agg++; }
    else { let c = S.cats.find(c => norm(c.nome) === norm(x.cat || "Importati"));
      if (!c) S.cats.push(c = {nome: x.cat || "Importati", prodotti: []});
      c.prodotti.push({nome, prezzo: isNaN(x.prezzo) ? 0 : x.prezzo, codice: slug(nome), ing: x.ing, note: ""}); cre++; }
  }
  salva(); alert(`Ricettario aggiornato: ${agg} prodotti aggiornati, ${cre} nuovi.`); mostra();
}
function risultato() {
  if (!F.vendite || !F.inizio || !F.fine) return `<div class="card mut">Carica vendite, conta iniziale e conta finale per vedere lo scarto.</div>`;
  const m = mappaProdotti(), vend = somma("vendite"), acq = F.acquisti ? somma("acquisti") : acquistiDaFatture(), i0 = somma("inizio"), i1 = somma("fine"), teo = {};
  for (const [k, q] of Object.entries(vend)) { const p = m[k]; if (!p) continue;
    p.ing.forEach(r => { const s = qtaStd(r); if (s != null) teo[r.n] = (teo[r.n] || 0) + s * q; }); }
  const contati = Object.keys(i1).filter(n => n in i0);
  const righe = contati.map(n => { const g = S.ingr[n] || {}, reale = i0[n] + (acq[n] || 0) - i1[n], t = teo[n] || 0, d = reale - t;
    return {n, u: g.u || "", t, reale, d, pct: t > 0 ? d / t : null, eur: g.costo != null ? d * g.costo : null}; })
    .sort((a, b) => (b.eur ?? b.d) - (a.eur ?? a.d));
  const tot = righe.reduce((a, r) => a + Math.max(0, r.eur || 0), 0);
  window._scarto = righe;
  return `<div class="card"><h2>Scarto della settimana</h2><p class="mut">${!F.acquisti && FAT.righe.length ? "Acquisti presi dalle fatture XML caricate (controlla che siano del periodo tra le due conte). " : ""}Reale = conta iniziale + acquisti − conta finale. Ricetta = prodotti venduti × grammature. Solo gli ingredienti presenti in entrambe le conte.</p>
    <p style="font-size:26px;font-weight:700;margin:4px 0;color:${tot > 30 ? "var(--ko)" : "var(--ok)"}">${eur(tot)} <span class="mut" style="font-weight:400">consumati oltre la ricetta</span></p>
    <table><tr><th>Ingrediente</th><th class="n">Ricetta</th><th class="n">Usato</th><th class="n">Differenza</th><th class="n">Scarto</th><th class="n">€</th></tr>
    ${righe.map(r => { const col = r.pct == null ? "" : r.pct > 0.05 ? "var(--ko)" : r.pct > 0.025 ? "var(--warn)" : "var(--ok)";
      return `<tr><td>${r.n.replace(/_/g, " ")}</td><td class="n">${IT(r.t)} ${r.u}</td><td class="n">${IT(r.reale)} ${r.u}</td><td class="n">${IT(r.d)} ${r.u}</td>
      <td class="n" style="color:${col};font-weight:600">${r.pct == null ? (r.t === 0 ? "senza ricetta" : "–") : (r.pct > 0 ? "+" : "") + IT(r.pct * 100, 1) + "%"}</td><td class="n">${eur(r.eur)}</td></tr>`; }).join("")}</table>
    <p class="mut">Rosso = oltre il 5% di tolleranza. "Senza ricetta" = l'ingrediente è contato ma nessun prodotto venduto lo usa (controlla nomi e grammature).</p>
    <button class="b" onclick="scaricaScarto()">Scarica il risultato (CSV)</button></div>`;
}

/* ===== VISTA CONTO ECONOMICO (temporanea, dai file importati) ===== */
let CEP = {iva: 10, giorni: 7};
function sommaCol(id, col, filtro) { const f = F[id]; if (!f || !col) return 0;
  return f.righe.reduce((a, r) => { const v = num(r[col]); return a + (!isNaN(v) && (!filtro || filtro(r)) ? v : 0); }, 0); }
function valoreConta(id) { const q = somma(id); let v = 0, manca = []; for (const [n, x] of Object.entries(q)) { const c = S.ingr[n]?.costo; if (c == null) manca.push(n); else v += c * x; } return {v, manca}; }
function vistaCE() {
  const iva = CEP.iva / 100, fa = F.acquisti, fp = F.personale;
  const ricavi = sommaCol("vendite", F.vendite?.e) / (1 + iva);
  const cat = r => norm(fa?.c ? r[fa.c] : "food");
  const acqFood = sommaCol("acquisti", fa?.e, r => !fa.c || /food|cibo|aliment|merc/.test(cat(r)) || cat(r) === "");
  const acqBev = sommaCol("acquisti", fa?.e, r => fa.c && /bev|bibit|birr|vin/.test(cat(r)));
  const acqAltro = sommaCol("acquisti", fa?.e) - acqFood - acqBev;
  const NOFOOD = /detergent|sgrassat|ipoclorit|sacchi|guant|tovagliol|asciugaman|scatola|vassoio|carta|rotolo|mop\b|brill|soppal|sacchett|busta|cauzion|bicchier|piatti|posate|cannucc|pellicol|allumin/i;
  const acqFat = F.acquisti ? 0 : FAT.righe.filter(r => !NOFOOD.test(r.desc)).reduce((a, r) => a + r.eur, 0);
  const nonFood = F.acquisti ? 0 : FAT.righe.filter(r => NOFOOD.test(r.desc)).reduce((a, r) => a + r.eur, 0);
  const r0 = valoreConta("inizio"), r1 = valoreConta("fine");
  const merci = acqFood + acqBev + acqFat + (F.inizio && F.fine ? r0.v - r1.v : 0);
  let pers = 0;
  if (fp) pers = fp.e ? sommaCol("personale", fp.e) : fp.righe.reduce((a, r) => a + (num(r[fp.q]) || 0) * (num(r[fp.h]) || 0), 0);
  const altri = sommaCol("costi", F.costi?.e) + acqAltro + nonFood;
  const margine = ricavi - merci, ris = margine - pers - altri;
  const pc = x => ricavi ? IT(x / ricavi * 100, 1) + "%" : "–";
  const mc = ricavi ? margine / ricavi : 0, pareggio = mc > 0 ? (pers + altri) / mc : null;
  const riga = (t, v, b, c) => `<tr style="${b ? "font-weight:700" : ""}"><td>${t}</td><td class="n" style="${c ? `color:${c}` : ""}">${eur(v)}</td><td class="n mut">${pc(v)}</td></tr>`;
  const mancano = ["vendite", "acquisti", "personale", "costi"].filter(x => !F[x] && !(x === "acquisti" && FAT.righe.length));
  return `<div class="card"><h2>Conto economico del periodo</h2><p class="mut">Calcolato dai file caricati in "Importa e calcola". Le rimanenze sono le due conte valorizzate ai costi degli ingredienti
    (con le sole conte di classe A è una stima: per il mese usate l'inventario completo).</p>
    <div class="top"><label class="mut">IVA media sulle vendite % <input style="width:60px" value="${CEP.iva}" onchange="CEP.iva=num(this.value)||10;mostra()"></label>
    <label class="mut">Giorni di apertura nel periodo <input style="width:60px" value="${CEP.giorni}" onchange="CEP.giorni=num(this.value)||7;mostra()"></label></div>
    ${mancano.length ? `<p class="warn">Da caricare in "Importa e calcola": ${mancano.join(", ")}${!F.vendite?.e && F.vendite ? " · nelle vendite scegli la colonna dell'incasso" : ""}.</p>` : ""}
    <table><tr><th>Voce</th><th class="n">Euro</th><th class="n">% sui ricavi</th></tr>
    ${riga("Ricavi netti (IVA esclusa)", ricavi, true)}
    ${acqFat ? riga("Acquisti da fatture XML", acqFat) : riga("Acquisti food", acqFood)}${acqBev ? riga("Acquisti bevande", acqBev) : ""}
    ${F.inizio && F.fine ? riga("Variazione rimanenze (iniziale − finale)", r0.v - r1.v) : ""}
    ${riga("COSTO MERCI", merci, true)}${riga("MARGINE", margine, true)}
    ${riga("Costo personale", pers)}${riga("Altri costi" + (acqAltro || nonFood ? " (incl. imballaggi e detersivi)" : ""), altri)}
    ${riga("RISULTATO", ris, true, ris >= 0 ? "var(--ok)" : "var(--ko)")}</table>
    <div class="grid" style="margin-top:10px">
     <div><b>Food cost</b><br><span style="font-size:22px;color:${merci / ricavi > 0.3 ? "var(--ko)" : "var(--ok)"}">${pc(merci)}</span><br><span class="mut">obiettivo max 30%</span></div>
     <div><b>Costo lavoro</b><br><span style="font-size:22px;color:${pers / ricavi > 0.3 ? "var(--ko)" : "var(--ok)"}">${pc(pers)}</span><br><span class="mut">obiettivo max 30%</span></div>
     <div><b>Prime cost</b><br><span style="font-size:22px;color:${(merci + pers) / ricavi > 0.6 ? "var(--ko)" : "var(--ok)"}">${pc(merci + pers)}</span><br><span class="mut">merci + personale, max 60%</span></div>
     <div><b>Pareggio</b><br><span style="font-size:22px">${pareggio ? eur(pareggio / CEP.giorni) : "–"}</span><br><span class="mut">ricavi netti a serata per stare in pari</span></div></div>
    ${r0.manca.length || r1.manca.length ? `<p class="warn">Ingredienti contati senza costo (valgono zero nelle rimanenze): ${[...new Set(r0.manca.concat(r1.manca))].join(", ")}.</p>` : ""}</div>`;
}

/* ===== VISTA ESPORTA ===== */
function vistaEsporta() {
  return `<div class="card"><h2>Salva ed esporta</h2>
   <p class="mut">Il ricettario è salvato solo in <b>questo browser</b>. Per usarlo su un altro dispositivo o non perderlo, scarica il backup e caricalo dall'altra parte.</p>
   <div class="top"><button class="b p" onclick="scarica('ricettario_galleon.json', JSON.stringify(S, null, 1), 'application/json')">Scarica backup</button>
   <label class="b" style="cursor:pointer">Carica backup <input type="file" accept=".json" hidden onchange="caricaBackup(this.files[0])"></label></div></div>
  <div class="card"><h2>File per il sistema report del PC</h2><p class="mut">Da mettere nella cartella <code>anagrafiche</code> quando installeremo il sistema sul PC del locale.</p>
   <div class="top"><button class="b" onclick="esportaRicette()">ricette.csv</button><button class="b" onclick="esportaIngr()">ingredienti.csv</button>
   <button class="b" onclick="esportaExcel()">Ricettario completo (Excel)</button></div></div>
  <div class="card"><h2>Ricomincia</h2><p class="mut">Ripristina il ricettario estratto dal menu. Le tue modifiche vanno perse (fai prima un backup).</p>
   <button class="b" onclick="if(confirm('Sicuro? Perdi tutte le modifiche.')){S=iniziale();salva();mostra()}">Ripristina dal menu</button></div>`;
}
function scarica(nome, testo, tipo = "text/csv") {
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["﻿" + testo], {type: tipo})); a.download = nome; a.click();
}
const n3 = x => x == null ? "" : String(Math.round(x * 1000) / 1000).replace(".", ",");
function esportaRicette() {
  scarica("ricette.csv", "codice;ingrediente;quantita\n" + S.cats.flatMap(c => c.prodotti.flatMap(p => p.ing.filter(r => r.q != null).map(r => `${p.codice};${r.n};${n3(qtaStd(r))}`))).join("\n"));
}
function esportaIngr() {
  scarica("ingredienti.csv", "ingrediente;unita;costo_unitario_default;classe\n" + Object.entries(S.ingr).map(([n, g]) => `${n};${g.u};${g.costo == null ? "" : n3(g.costo)};${g.classe}`).join("\n"));
}
function esportaExcel() {
  const rows = S.cats.flatMap(c => c.prodotti.flatMap(p => p.ing.map(r => ({categoria: c.nome, prodotto: p.nome, prezzo: p.prezzo, codice_cassa: p.codice, ingrediente: r.n,
    quantita: r.q, unita: S.ingr[r.n]?.u === "pz" ? "pz" : "g", classe: S.ingr[r.n]?.classe, costo_unitario: S.ingr[r.n]?.costo, note: p.note}))));
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), "Ricettario");
  XLSX.writeFile(wb, "ricettario_galleon.xlsx");
}
function scaricaScarto() {
  scarica("scarto_settimana.csv", "ingrediente;unita;ricetta;usato;differenza;scarto_pct;euro\n" + (window._scarto || []).map(r =>
    [r.n, r.u, n3(r.t), n3(r.reale), n3(r.d), r.pct == null ? "" : n3(r.pct * 100), r.eur == null ? "" : n3(r.eur)].join(";")).join("\n"));
}
async function caricaBackup(f) { try { const x = JSON.parse(await f.text()); if (!x.cats) throw 0; S = x; salva(); mostra(); alert("Backup caricato."); } catch (e) { alert("File non valido."); } }

/* ===== navigazione ===== */
const VISTE = [["ricettario", "📖 Ricettario", vistaRicettario], ["ingredienti", "🧀 Ingredienti", vistaIngredienti], ["importa", "📥 Importa e calcola", vistaImporta], ["ce", "📊 Conto economico", vistaCE], ["esporta", "💾 Salva ed esporta", vistaEsporta]];
let vista = (location.hash || "#ricettario").slice(1);
function mostra(tieniFocus) {
  if (!VISTE.some(v => v[0] === vista)) vista = "ricettario";
  $("nav").innerHTML = VISTE.map(([id, t]) => `<button class="${id === vista ? "on" : ""}" onclick="vista='${id}';location.hash='${id}';mostra()">${t}</button>`).join("")
    + `<a href="index.html">⚓ Cruscotto</a><a href="conta.html">📋 Conta</a>`;
  const pos = tieniFocus && document.activeElement?.id === "cerca" ? document.activeElement.selectionStart : null;
  $("main").innerHTML = VISTE.find(v => v[0] === vista)[2]();
  if (pos != null) { const c = $("cerca"); c.focus(); c.setSelectionRange(pos, pos); }
}
salva();
mostra();
</script>
