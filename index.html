<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#14202b">
<title>The Galleon · Plancia di comando</title>
<!--
  APP "PLANCIA DI COMANDO" - The Galleon
  Legge i numeri da dati.js (scritto ogni notte da pipeline.py) e li mostra.
  Nessuna libreria esterna: funziona con doppio clic anche senza internet.
-->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0f1b26;--navy2:#1b2d3e;--oro:#d4a24c;--oro2:#f3e2bf;--bg:#f5f0e6;--card:#fff;--card2:#faf6ee;--line:#efe8dc;--txt:#1b222a;--mut:#6b7380;
--ok:#2e9e62;--warn:#e0a526;--ko:#d1453b;--blu:#3b7dd8;--r:20px;--sh:0 1px 2px #0000000a,0 8px 28px #0f1b2612;--needle:#0f1b26;--quad:.55}
[data-theme=dark]{--bg:#0a1219;--card:#13202c;--card2:#1a2a38;--line:#22344a;--txt:#e9e6df;--mut:#94a1ae;--sh:0 1px 2px #0004,0 8px 28px #0006;--needle:#e9e6df;--quad:.16;--oro2:#3a2f1a}
*{box-sizing:border-box}html,body{margin:0}body{font-family:Inter,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased;transition:background .3s}
header{background:radial-gradient(1200px 300px at 85% -50%,#2a4560 0,transparent 60%),var(--navy);color:#fff;padding:20px 22px 74px}
.brand{display:flex;align-items:center;gap:14px;max-width:1180px;margin:auto}
.logo{width:46px;height:46px;border-radius:14px;background:#ffffff10;border:1px solid #ffffff1f;display:grid;place-items:center;flex:none}.logo svg{width:28px;height:28px}
.brand h1{margin:0;font:700 23px Fraunces,Georgia,serif;letter-spacing:.2px}.brand p{margin:3px 0 0;font-size:13px;color:#aeb9c4}
.tema{margin-left:auto;background:#ffffff12;border:1px solid #ffffff22;color:#fff;width:40px;height:40px;border-radius:12px;cursor:pointer;display:grid;place-items:center}
.tema:hover{background:#ffffff22}
nav{max-width:1180px;margin:20px auto 0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
nav button{background:transparent;border:0;color:#c3ccd5;padding:10px 16px;border-radius:999px;font:500 14px Inter,sans-serif;cursor:pointer;white-space:nowrap;display:flex;gap:8px;align-items:center;transition:all .2s}
nav button.on{background:var(--oro);color:var(--navy);box-shadow:0 4px 14px #d4a24c55}nav button:hover:not(.on){background:#ffffff14;color:#fff}
main{max-width:1180px;margin:-52px auto 0;padding:0 16px 110px;position:relative}
.grid{display:grid;gap:16px}.g3{grid-template-columns:1.4fr 1fr 1fr}.g2{grid-template-columns:1fr 1fr}
.card{background:var(--card);border-radius:var(--r);padding:20px 22px;box-shadow:var(--sh);animation:su .5s ease-out both}
.grid>.card:nth-child(2){animation-delay:.06s}.grid>.card:nth-child(3){animation-delay:.12s}
@keyframes su{from{opacity:0;transform:translateY(10px)}}
.card h2{margin:0 0 4px;font-size:16px;font-weight:600}.card .sub{font-size:13px;color:var(--mut);margin:0 0 14px}
.sec{margin-top:16px}
.hero{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:16px;padding:16px 22px}
.hero .ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;flex:none}
.hero h2{font:700 21px Fraunces,Georgia,serif;margin:0}.hero p{margin:3px 0 0;color:var(--mut);font-size:14px}
.pill{display:inline-block;padding:5px 13px;border-radius:999px;font-size:12px;font-weight:600}
.pill.ok,.okb{background:#e3f4ea;color:#1d6e43}.pill.warn,.warnb{background:#fcf1d6;color:#8a5f07}.pill.ko,.kob{background:#fbe4e2;color:#9b2a22}
[data-theme=dark] .pill.ok,[data-theme=dark] .okb{background:#173a2a;color:#7fd9a8}[data-theme=dark] .pill.warn,[data-theme=dark] .warnb{background:#3d3115;color:#f1c96b}[data-theme=dark] .pill.ko,[data-theme=dark] .kob{background:#43201d;color:#f19a92}
.gauge-big{text-align:center}.gauge-big svg{width:100%;max-width:380px}.gauge-s{text-align:center}.gauge-s svg{width:100%;max-width:270px}
.needle{transition:transform 1.6s cubic-bezier(.2,1.25,.4,1);transform-origin:150px 160px}
.gc{font:700 30px Inter,sans-serif;fill:var(--txt)}.tick{stroke:var(--line)}.hub{fill:var(--needle)}
.seg{display:inline-flex;background:var(--card2);border-radius:999px;padding:4px;margin-bottom:14px;border:1px solid var(--line)}
.seg button{border:0;background:transparent;padding:7px 15px;border-radius:999px;font:500 13px Inter,sans-serif;cursor:pointer;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--txt);box-shadow:0 1px 4px #0002}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.kpi{background:var(--card2);border-radius:16px;padding:13px 15px;position:relative;overflow:hidden;border:1px solid var(--line)}
.kpi .h{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--mut)}.kpi .h svg{width:15px;height:15px;opacity:.8}
.kpi b{display:block;font-size:24px;font-weight:700;margin-top:4px;letter-spacing:-.3px}
.kpi.ok{border-left:4px solid var(--ok)}.kpi.ko{border-left:4px solid var(--ko)}
.delta{font-size:12px;font-weight:600;margin-top:2px}.delta.su{color:var(--ok)}.delta.giu{color:var(--ko)}
.spark{position:absolute;right:10px;bottom:10px;width:70px;height:26px;opacity:.9}
.avvisi{list-style:none;padding:0;margin:0}.avvisi li{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.45}
.avvisi li:last-child{border:0}.dot{flex:none;width:10px;height:10px;border-radius:50%;margin-top:5px;background:var(--oro);box-shadow:0 0 0 4px #d4a24c22}.dot.ko{background:var(--ko);box-shadow:0 0 0 4px #d1453b22}
svg text{font-family:Inter,sans-serif}.ax{font-size:11px;fill:var(--mut)}.lbl{fill:var(--txt);stroke:var(--card);stroke-width:3px;paint-order:stroke;font-size:12px;font-weight:600}
.grid-l{stroke:var(--line)}.quad{opacity:var(--quad)}.pt{fill:var(--card)}
.chart{width:100%;height:auto;display:block}.bar{transition:opacity .2s;cursor:pointer}.bar:hover{opacity:.75}
rect.bar{transform-box:fill-box;transform-origin:bottom;animation:grow .7s cubic-bezier(.2,.8,.3,1) both}@keyframes grow{from{transform:scaleY(0)}}
.tip{position:fixed;pointer-events:none;background:var(--navy);color:#fff;padding:7px 11px;border-radius:10px;font-size:12px;font-weight:500;opacity:0;transition:opacity .15s;z-index:9;box-shadow:0 6px 20px #0004}
.chips{display:inline-flex;gap:4px;flex-wrap:wrap;margin-bottom:16px;background:var(--card);padding:5px;border-radius:999px;box-shadow:var(--sh)}
.chips button{border:0;background:transparent;padding:8px 16px;border-radius:999px;cursor:pointer;font:500 13px Inter,sans-serif;color:var(--txt);text-transform:capitalize}
.chips button.on{background:var(--navy);color:#fff}[data-theme=dark] .chips button.on{background:var(--oro);color:var(--navy)}
.cento{display:flex;height:50px;border-radius:14px;overflow:hidden;margin:6px 0 12px;gap:3px}.cento div{display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:700;min-width:0;overflow:hidden;white-space:nowrap;border-radius:6px}
.leg{display:flex;flex-wrap:wrap;gap:14px;font-size:13px}.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px 6px;text-align:right;border-bottom:1px solid var(--line)}th{color:var(--mut);font-weight:500;text-transform:capitalize}th:first-child,td:first-child{text-align:left}
tr.big td{font-weight:700}.tw{overflow-x:auto}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:10px}
.item{border:1px solid var(--line);border-radius:16px;padding:13px 15px;background:var(--card2);transition:transform .2s}.item:hover{transform:translateY(-2px)}
.item h3{margin:0;font-size:15px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.item .r{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin-top:6px}.item .az{font-size:12.5px;margin-top:9px;padding-top:9px;border-top:1px dashed var(--line)}
.cls{font-size:11px;padding:3px 10px;border-radius:999px;font-weight:600;white-space:nowrap}
.Star{background:#e3f4ea;color:#1d6e43}.Plowhorse{background:#e3edfb;color:#24508f}.Puzzle{background:#fcf1d6;color:#8a5f07}.Dog{background:#fbe4e2;color:#9b2a22}
.hb{display:grid;grid-template-columns:140px 1fr 80px;gap:12px;align-items:center;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line)}
.hb .t{background:var(--card2);border-radius:6px;height:12px;position:relative}.hb .t div{position:absolute;top:0;bottom:0;border-radius:6px}
.hb .mid{position:absolute;left:50%;top:-4px;bottom:-4px;width:2px;background:var(--line)}
.big-n{font-size:30px;font-weight:700;letter-spacing:-.5px}.mut{color:var(--mut);font-size:13px}
footer{text-align:center;color:var(--mut);font-size:12px;margin-top:28px}
@media(max-width:860px){.g3,.g2{grid-template-columns:1fr}header{padding:16px 16px 66px}.brand h1{font-size:21px}.pc{display:none}main{padding:0 12px 110px}
 nav{position:fixed;bottom:12px;left:12px;right:12px;margin:0;background:#0f1b26ee;backdrop-filter:blur(10px);padding:7px;justify-content:space-around;z-index:5;border-radius:22px;box-shadow:0 8px 30px #0006}
 nav button{flex-direction:column;gap:3px;font-size:11px;padding:7px 10px;border-radius:15px}.chips{border-radius:16px}.hb{grid-template-columns:100px 1fr 60px}.card{padding:18px}}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo"><svg viewBox="0 0 48 48" fill="none" stroke="#d4a24c" stroke-width="2.6" stroke-linecap="round"><circle cx="24" cy="10" r="4"/><path d="M24 14v28M14 22h20M8 30c2 8 9 12 16 12s14-4 16-12M8 30l-3 3M40 30l3 3"/></svg></div>
    <div><h1>The Galleon<span class="pc"> · Plancia di comando</span></h1><p id="sottotitolo"></p></div>
    <button class="tema" id="tema" aria-label="Cambia tema chiaro/scuro" onclick="cambiaTema()"></button>
  </div>
  <nav id="nav"></nav>
</header>
<main id="main"></main>
<div class="tip" id="tip"></div>
<script src="dati.js"></script>
<script>
const D = window.GALLEON;
const IT = new Intl.NumberFormat("it-IT", {useGrouping: "always"});
const eur = (x, d) => x == null ? "–" : "€ " + new Intl.NumberFormat("it-IT", {useGrouping: "always", maximumFractionDigits: d ?? (Math.abs(x) >= 100 ? 0 : 2), minimumFractionDigits: d ?? (Math.abs(x) >= 100 ? 0 : 2)}).format(x);
const pct = x => x == null ? "–" : (x * 100).toLocaleString("it-IT", {maximumFractionDigits: 1, minimumFractionDigits: 1}) + "%";
const num = x => x == null ? "–" : IT.format(Math.round(x));
const gg = s => { const d = new Date(s + "T12:00"); return d.toLocaleDateString("it-IT", {weekday: "short", day: "2-digit", month: "2-digit"}); };
const meseNome = m => { const [y, mm] = m.split(" ")[0].split("-"); return new Date(y, mm - 1, 15).toLocaleDateString("it-IT", {month: "long", year: "numeric"}); };
const $ = s => document.querySelector(s);
const tip = $("#tip");
function tipOn(e, t) { tip.textContent = t; tip.style.opacity = 1; tip.style.left = (e.clientX + 12) + "px"; tip.style.top = (e.clientY - 34) + "px"; }
function tipOff() { tip.style.opacity = 0; }

/* ---------- tachimetro ---------- */
function gauge(val, min, max, zone, centro, sotto, id) {
  const cx = 150, cy = 160, r = 120, A = v => Math.PI * (1 - (Math.min(Math.max(v, min), max) - min) / (max - min));
  const P = (a, rr) => [cx + rr * Math.cos(a), cy - rr * Math.sin(a)];
  let s = `<svg viewBox="0 0 300 228">`;
  for (const [da, a, col] of zone) {
    const [x1, y1] = P(A(da), r), [x2, y2] = P(A(a), r);
    s += `<path d="M${x1},${y1} A${r},${r} 0 0 1 ${x2},${y2}" stroke="${col}" stroke-width="22" stroke-linecap="butt" fill="none"/>`;
  }
  for (let i = 0; i <= 10; i++) { const a = Math.PI * (1 - i / 10), [x1, y1] = P(a, 96), [x2, y2] = P(a, 104);
    s += `<line class="tick" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke-width="2"/>`; }
  const gradi = 180 * (Math.min(Math.max(val, min), max) - min) / (max - min);
  s += `<g class="needle" id="${id}" style="transform:rotate(0deg)"><line x1="${cx}" y1="${cy}" x2="${cx - 92}" y2="${cy}" style="stroke:var(--needle)" stroke-width="5" stroke-linecap="round"/></g>
        <circle class="hub" cx="${cx}" cy="${cy}" r="12"/><circle cx="${cx}" cy="${cy}" r="4.5" fill="#d4a24c"/>
        <text x="${cx}" y="${cy + 42}" text-anchor="middle" class="gc">${centro}</text>
        <text x="${cx}" y="${cy + 59}" text-anchor="middle" class="ax" font-size="12">${sotto}</text></svg>`;
  setTimeout(() => { const n = document.getElementById(id); if (n) n.style.transform = `rotate(${gradi}deg)`; }, 80);
  return s;
}
const OK = "#2e9e62", WARN = "#e0a526", KO = "#d1453b";


/* ---------- tema, icone, mini-grafici, numeri animati ---------- */
const ICO = {euro: "M17 7a6 6 0 100 10M5 10h8M5 14h8", users: "M16 19v-1a4 4 0 00-8 0v1M12 11a3 3 0 100-6 3 3 0 000 6M20 19v-1a3 3 0 00-3-3M17 5a3 3 0 010 6",
  ticket: "M4 7h16v3a2 2 0 000 4v3H4v-3a2 2 0 000-4z", clock: "M12 21a9 9 0 100-18 9 9 0 000 18M12 7v5l3 2", team: "M3 20v-2a4 4 0 014-4h4a4 4 0 014 4v2M9 10a3 3 0 100-6 3 3 0 000 6M21 20v-1a3 3 0 00-2-3",
  pizza: "M12 3l9 17H3zM10 12h.01M14 15h.01M11 17h.01", sun: "M12 17a5 5 0 100-10 5 5 0 000 10M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4",
  moon: "M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"};
const ico = (k, w = 15) => `<svg width="${w}" height="${w}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${ICO[k]}"/></svg>`;
function spark(v, col = "#d4a24c") {
  const mx = Math.max(...v), mn = Math.min(...v), X = i => i * 70 / (v.length - 1), Y = x => 24 - 22 * (x - mn) / ((mx - mn) || 1);
  const pts = v.map((x, i) => `${X(i)},${Y(x)}`).join(" ");
  return `<svg class="spark" viewBox="0 0 70 26"><polyline points="0,26 ${pts} 70,26" fill="${col}22" stroke="none"/><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"/></svg>`;
}
function cambiaTema(t) {
  t = t || (document.documentElement.dataset.theme === "dark" ? "light" : "dark");
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem("galleon-tema", t); } catch (e) {}
  $("#tema").innerHTML = ico(t === "dark" ? "sun" : "moon", 19);
}
function animaNumeri() {
  document.querySelectorAll("[data-n]").forEach(el => {
    const fine = +el.dataset.n, f = {eur: x => eur(x, 0), eur2: x => eur(x, 2), num, pct}[el.dataset.f], t0 = performance.now();
    const step = t => { const k = Math.min(1, (t - t0) / 900), e = 1 - Math.pow(1 - k, 3); el.textContent = f(fine * e); if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}

/* ---------- grafico a barre ---------- */
function barre(valori, etichette, rif, fmt, colori, h = 230) {
  const w = 760, L = 58, top = Math.max(...valori, rif || 0) * 1.12 || 1, bot = Math.min(0, ...valori);
  const sx = (w - L - 10) / valori.length, Y = v => 14 + (h - 44) * (top - v) / (top - bot);
  let s = `<svg class="chart" viewBox="0 0 ${w} ${h}">`;
  [0.5, 1].forEach(f => { const v = (top / 1.12) * f; s += `<line class="grid-l" x1="${L}" x2="${w - 10}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end" class="ax">${fmt(v)}</text>`; });
  valori.forEach((v, i) => {
    const x = L + i * sx, y0 = Y(0), y1 = Y(v);
    s += `<rect class="bar" data-t="${etichette[i]}: ${fmt(v)}" x="${x + sx * .14}" y="${Math.min(y0, y1)}" width="${sx * .72}" height="${Math.max(1, Math.abs(y0 - y1))}" rx="${Math.min(6, sx * .2)}" fill="${colori[i]}"/>`;
    if (valori.length <= 12 || i % Math.ceil(valori.length / 8) === 0) s += `<text x="${x + sx / 2}" y="${h - 10}" text-anchor="middle" class="ax">${etichette[i]}</text>`;
  });
  if (rif) s += `<line x1="${L}" x2="${w - 10}" y1="${Y(rif)}" y2="${Y(rif)}" stroke="${KO}" stroke-width="2" stroke-dasharray="6 5"/><text x="${w - 12}" y="${Y(rif) - 7}" text-anchor="end" font-size="12" font-weight="600" fill="${KO}" style="stroke:var(--card)" stroke-width="4" paint-order="stroke">pareggio ${fmt(rif)}</text>`;
  return s + "</svg>";
}
function linee(serie, etichette, soglia, h = 210) {
  const w = 760, L = 50, R = 90, vals = serie.flatMap(s => s.v).filter(v => v != null).concat(soglia ? [soglia] : []);
  const top = Math.max(...vals) * 1.2, bot = Math.max(0, Math.min(...vals) * .7), n = etichette.length;
  const X = i => L + i * (w - L - R) / Math.max(1, n - 1), Y = v => 14 + (h - 44) * (top - v) / (top - bot);
  let s = `<svg class="chart" viewBox="0 0 ${w} ${h}">`;
  if (soglia) s += `<line x1="${L}" x2="${X(n - 1)}" y1="${Y(soglia)}" y2="${Y(soglia)}" stroke="${KO}" stroke-dasharray="6 5" stroke-width="1.5"/><text x="${L - 6}" y="${Y(soglia) + 4}" text-anchor="end" class="ax">${pct(soglia)}</text>`;
  for (const sr of serie) {
    s += `<polyline points="${sr.v.map((v, i) => `${X(i)},${Y(v)}`).join(" ")}" fill="none" stroke="${sr.c}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
    sr.v.forEach((v, i) => s += `<circle class="bar" data-t="${sr.n} sett. ${etichette[i]}: ${pct(v)}" cx="${X(i)}" cy="${Y(v)}" r="4.5" class="pt" stroke="${sr.c}" stroke-width="2.5"/>`);
    s += `<text x="${X(n - 1) + 10}" y="${Y(sr.v[n - 1]) + 4}" font-size="12" font-weight="600" fill="${sr.c}">${sr.n} ${pct(sr.v[n - 1])}</text>`;
  }
  etichette.forEach((e, i) => { if (n <= 8 || i % 2 === 0) s += `<text x="${X(i)}" y="${h - 10}" text-anchor="middle" class="ax">${e}</text>`; });
  return s + "</svg>";
}
document.addEventListener("mousemove", e => { const t = e.target.closest?.(".bar"); t ? tipOn(e, t.dataset.t) : tipOff(); });
document.addEventListener("touchstart", e => { const t = e.target.closest?.(".bar"); if (t) tipOn(e.touches[0], t.dataset.t); else tipOff(); }, {passive: true});

/* ---------- VISTA 1: ROTTA ---------- */
let periodo = 2;
function vistaRotta() {
  const b = D.bussola, rp = b.rapporto * 100;
  const stato = rp < 100 ? ["ko", "In perdita"] : rp < 120 ? ["warn", "Margine stretto"] : ["ok", "In rotta"];
  const fcMax = D.obiettivi.food_cost_max * 100, clMax = D.obiettivi.costo_lavoro_max * 100;
  const mese = D.mesi[D.mesi.length - 1];
  const icH = {ok: ["#e3f4ea", OK, "M5 13l4 4L19 7"], warn: ["#fcf1d6", WARN, "M12 9v4M12 17h.01M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"], ko: ["#fbe4e2", KO, "M12 9v4M12 17h.01M12 3a9 9 0 100 18 9 9 0 000-18z"]}[stato[0]];
  const nomeMese = meseNome(mese.mese).split(" ")[0];
  let h = `<div class="card hero"><div class="ic" style="background:${icH[0]}"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="${icH[1]}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="${icH[2]}"/></svg></div>
    <div style="flex:1;min-width:220px"><h2>${nomeMese[0].toUpperCase() + nomeMese.slice(1)}: ${stato[1].toLowerCase()}</h2>
    <p>A questo ritmo chiudi il mese con un risultato di <b style="color:${b.risultato >= 0 ? OK : KO}">${eur(b.risultato)}</b>. Per stare in pari servono circa ${eur(b.pareggio_giorno, 0)} netti a serata.</p></div>
    <span class="pill ${stato[0]}">${(n => n === 1 ? "1 avviso importante" : n + " avvisi importanti")(D.avvisi.filter(a => a.alto).length)}</span></div>
  <div class="grid g3">
   <div class="card gauge-big"><h2>Rotta verso l'utile</h2><p class="sub">Dove arrivi a fine mese a questo ritmo</p>
     ${gauge(rp, 50, 200, [[50, 100, KO], [100, 120, WARN], [120, 200, OK]], Math.round(rp) + "%", "del punto di pareggio", "g1")}
     <span class="pill ${stato[0]}">${stato[1]}</span>
     <p class="mut" style="margin:10px 0 0">Risultato stimato a fine ${meseNome(mese.mese).split(" ")[0]}: <b style="color:var(--txt)">${eur(b.risultato)}</b></p></div>
   <div class="card gauge-s"><h2>Food cost</h2><p class="sub">Obiettivo massimo ${fcMax}%</p>
     ${gauge(b.food_cost * 100, 10, 50, [[10, fcMax - 3, OK], [fcMax - 3, fcMax, WARN], [fcMax, 50, KO]], pct(b.food_cost), "mese in corso", "g2")}</div>
   <div class="card gauge-s"><h2>Costo del lavoro</h2><p class="sub">Obiettivo massimo ${clMax}%</p>
     ${gauge(b.costo_lavoro * 100, 10, 50, [[10, clMax - 3, OK], [clMax - 3, clMax, WARN], [clMax, 50, KO]], pct(b.costo_lavoro), "mese in corso", "g3")}</div>
  </div>`;
  const nomi = Object.keys(D.kpi), k = D.kpi[nomi[periodo]];
  const somma = a => a.reduce((s, g) => s + g.ricavi, 0), Gi = D.giorni;
  let delta = "";
  if (periodo === 1 && Gi.length >= 14) { const d = somma(Gi.slice(-7)) / somma(Gi.slice(-14, -7)) - 1;
    delta = `<div class="delta ${d >= 0 ? "su" : "giu"}">${d >= 0 ? "▲" : "▼"} ${pct(Math.abs(d))} sulla settimana prima</div>`; }
  if (periodo === 0 && Gi.length >= 8) { const d = Gi[Gi.length - 1].ricavi / Gi[Gi.length - 8].ricavi - 1;
    delta = `<div class="delta ${d >= 0 ? "su" : "giu"}">${d >= 0 ? "▲" : "▼"} ${pct(Math.abs(d))} sullo stesso giorno scorso</div>`; }
  h += `<div class="grid g2 sec"><div class="card"><h2>I numeri</h2><p class="sub">Scegli il periodo</p>
     <div class="seg">${nomi.map((n, i) => `<button class="${i === periodo ? "on" : ""}" onclick="periodo=${i};mostra()">${n.replace("Ultima serata", "Ieri")}</button>`).join("")}</div>
     <div class="kpis">
      <div class="kpi"><div class="h">${ico("euro")}Ricavi netti</div><b data-n="${k["Ricavi netti"]}" data-f="eur">${eur(k["Ricavi netti"])}</b>${delta}${spark(D.giorni.slice(-14).map(g => g.ricavi))}</div>
      <div class="kpi"><div class="h">${ico("users")}Coperti</div><b data-n="${k["Coperti"]}" data-f="num">${num(k["Coperti"])}</b></div>
      <div class="kpi"><div class="h">${ico("ticket")}Scontrino medio a coperto</div><b data-n="${k["Scontrino medio/coperto (IVA incl.)"]}" data-f="eur2">${eur(k["Scontrino medio/coperto (IVA incl.)"], 2)}</b></div>
      <div class="kpi"><div class="h">${ico("clock")}Ricavo per ora lavorata</div><b data-n="${k["Ricavo per ora lavorata"]}" data-f="eur2">${eur(k["Ricavo per ora lavorata"], 2)}</b></div>
      <div class="kpi ${k["Costo lavoro %"] > D.obiettivi.costo_lavoro_max ? "ko" : "ok"}"><div class="h">${ico("team")}Costo lavoro</div><b data-n="${k["Costo lavoro %"]}" data-f="pct">${pct(k["Costo lavoro %"])}</b></div>
      <div class="kpi ${k["Food cost % teorico"] > D.obiettivi.food_cost_max ? "ko" : "ok"}"><div class="h">${ico("pizza")}Food cost</div><b data-n="${k["Food cost % teorico"]}" data-f="pct">${pct(k["Food cost % teorico"])}</b></div>
     </div></div>
   <div class="card"><h2>Cosa guardare oggi</h2><p class="sub">Avvisi calcolati automaticamente</p>
     <ul class="avvisi">${D.avvisi.length ? D.avvisi.map(a => `<li><span class="dot ${a.alto ? "ko" : ""}"></span>${a.testo}</li>`).join("") : "<li>Tutto sotto controllo.</li>"}</ul></div></div>`;
  const G = D.giorni;
  h += `<div class="card sec"><h2>Incassi delle ultime serate</h2><p class="sub">Verde = serata sopra il pareggio · tocca una barra per il dettaglio</p>
    ${barre(G.map(g => g.ricavi), G.map(g => gg(g.data)), b.pareggio_giorno, x => eur(x, 0), G.map(g => g.ricavi >= b.pareggio_giorno ? OK : "#d4a24c"))}</div>`;
  const S = D.settimane;
  h += `<div class="card sec"><h2>Food cost e costo del lavoro, settimana per settimana</h2><p class="sub">Linea rossa = obiettivo massimo</p>
    ${linee([{n: "Lavoro", v: S.map(s => s.lavoro), c: "#3b7dd8"}, {n: "Food", v: S.map(s => s.food), c: "#d4a24c"}], S.map(s => s.da.slice(8) + "/" + s.da.slice(5, 7)), D.obiettivi.food_cost_max)}</div>`;
  return h;
}

/* ---------- VISTA 2: CONTO ECONOMICO ---------- */
let meseSel = null;
function vistaConto() {
  const M = D.mesi; if (meseSel == null) meseSel = M.length - 1; const m = M[meseSel];
  const parti = [["Merci", m.costo_merci, "#d4a24c"], ["Personale", m.personale, "#3b7dd8"], ["Altri costi", m.altri, "#8a94a3"], ["Costi fissi", m.fissi, "#5b6573"], [m.risultato >= 0 ? "Utile" : "Perdita", Math.abs(m.risultato), m.risultato >= 0 ? OK : KO]];
  const su100 = v => Math.round(v / m.ricavi * 100);
  let h = `<div class="chips">${M.map((x, i) => `<button class="${i === meseSel ? "on" : ""}" onclick="meseSel=${i};mostra()">${meseNome(x.mese)}${x.in_corso ? " ·  in corso" : ""}</button>`).join("")}</div>
  <div class="grid g2"><div class="card"><h2>Su 100 € incassati, dove vanno?</h2><p class="sub">${meseNome(m.mese)} · ricavi netti ${eur(m.ricavi)}${m.in_corso ? " (mese in corso, costi fissi in proporzione ai giorni)" : ""}</p>
    <div class="cento">${parti.map(p => `<div style="flex:${Math.max(p[1], 0.001)};background:${p[2]}" title="${p[0]}">${su100(p[1]) >= 6 ? su100(p[1]) + " €" : ""}</div>`).join("")}</div>
    <div class="leg">${parti.map(p => `<span><i style="background:${p[2]}"></i>${p[0]} <b>${su100(p[1])} €</b></span>`).join("")}</div>
    <div style="display:flex;gap:28px;margin-top:18px;flex-wrap:wrap">
      <div><div class="mut">Risultato gestionale</div><div class="big-n" style="color:${m.risultato >= 0 ? OK : KO}">${eur(m.risultato)}</div></div>
      <div><div class="mut">Ricavi di pareggio</div><div class="big-n">${eur(m.pareggio)}</div></div>
      <div><div class="mut">Margine sul pareggio</div><div class="big-n">${pct(m.ricavi / m.pareggio - 1)}</div></div></div></div>
   <div class="card"><h2>Indicatori</h2><p class="sub">Inventario: ${m.rimanenze}</p><div class="tw"><table>
    <tr><th>Voce</th><th>Valore</th><th>Obiettivo</th></tr>
    <tr><td>Food cost effettivo</td><td>${pct(m.food_eff)}</td><td>≤ ${pct(D.obiettivi.food_cost_max)}</td></tr>
    <tr><td>Food cost teorico (ricette)</td><td>${pct(m.food_teo)}</td><td></td></tr>
    <tr><td>Costo del lavoro</td><td>${pct(m.lavoro)}</td><td>≤ ${pct(D.obiettivi.costo_lavoro_max)}</td></tr>
    <tr><td>Prime cost (merci + lavoro)</td><td>${pct(m.prime)}</td><td>≤ ${pct(D.obiettivi.prime_cost_max)}</td></tr>
    <tr><td>Coperti</td><td>${num(m.coperti)}</td><td></td></tr>
    <tr><td>di cui ricavi non scontrinati</td><td>${eur(m.non_scontrinato)}</td><td></td></tr></table></div></div></div>
  <div class="card sec"><h2>Conto economico mese per mese</h2><div class="tw"><table>
    <tr><th>Voce</th>${M.map(x => `<th>${meseNome(x.mese).split(" ")[0]}</th>`).join("")}</tr>
    ${[["Ricavi netti", "ricavi", 1], ["Costo merci", "costo_merci"], ["Personale", "personale"], ["Altri costi", "altri"], ["Costi fissi", "fissi"], ["Risultato", "risultato", 1]]
      .map(([l, k, b]) => `<tr class="${b ? "big" : ""}"><td>${l}</td>${M.map(x => `<td style="${k === "risultato" ? "color:" + (x[k] >= 0 ? OK : KO) : ""}">${eur(x[k])}</td>`).join("")}</tr>`).join("")}</table></div>
    ${barre(M.map(x => x.risultato), M.map(x => meseNome(x.mese).split(" ")[0]), null, x => eur(x, 0), M.map(x => x.risultato >= 0 ? OK : KO), 190)}</div>`;
  return h;
}

/* ---------- VISTA 3: MENU ENGINEERING ---------- */
let gruppo = null;
function vistaMenu() {
  const gruppi = [...new Set(D.menu.map(x => x.gruppo))]; if (!gruppo) gruppo = gruppi[gruppi.length - 1];
  const it = D.menu.filter(x => x.gruppo === gruppo), n = it.length;
  const mcMedio = it.reduce((a, x) => a + x.margine_tot, 0) / it.reduce((a, x) => a + x.venduti, 0), popMedia = 0.7 / n;
  const w = 560, h = 380, P = 46;
  const xs = it.map(x => x.mix / popMedia), ys = it.map(x => x.margine / mcMedio);
  const xM = Math.max(2, ...xs) * 1.1, yMin = Math.min(.5, ...ys) * .9, yM = Math.max(1.5, ...ys) * 1.08;
  const X = v => P + (w - P - 14) * v / xM, Y = v => 14 + (h - P - 14) * (yM - v) / (yM - yMin);
  const col = {Star: OK, Plowhorse: "#3b7dd8", Puzzle: WARN, Dog: KO};
  let s = `<svg class="chart" viewBox="0 0 ${w} ${h}">
    <rect x="${X(1)}" y="${Y(yM)}" width="${X(xM) - X(1)}" height="${Y(1) - Y(yM)}" fill="#e3f4ea" class="quad"/>
    <rect x="${P}" y="${Y(yM)}" width="${X(1) - P}" height="${Y(1) - Y(yM)}" fill="#fcf1d6" class="quad"/>
    <rect x="${X(1)}" y="${Y(1)}" width="${X(xM) - X(1)}" height="${Y(yMin) - Y(1)}" fill="#e3edfb" class="quad"/>
    <rect x="${P}" y="${Y(1)}" width="${X(1) - P}" height="${Y(yMin) - Y(1)}" fill="#fbe4e2" class="quad"/>
    <text x="${X(xM) - 8}" y="${Y(yM) + 18}" text-anchor="end" font-weight="700" font-size="13" fill="#1d6e43">STAR</text>
    <text x="${P + 8}" y="${Y(yM) + 18}" font-weight="700" font-size="13" fill="#8a5f07">PUZZLE</text>
    <text x="${X(xM) - 8}" y="${Y(yMin) - 8}" text-anchor="end" font-weight="700" font-size="13" fill="#24508f">PLOWHORSE</text>
    <text x="${P + 8}" y="${Y(yMin) - 8}" font-weight="700" font-size="13" fill="#9b2a22">DOG</text>
    <text x="${(w + P) / 2}" y="${h - 8}" text-anchor="middle" class="ax">popolarità →</text>
    <text x="14" y="${(h - P) / 2}" class="ax" transform="rotate(-90 14 ${(h - P) / 2})" text-anchor="middle">margine →</text>`;
  const posti = [];
  it.forEach((x, i) => { const rr = 8 + Math.sqrt(x.margine_tot) / 8, cx = X(xs[i]), cy = Y(ys[i]);
    const cerchi = it.map((z, j) => [X(xs[j]), Y(ys[j]), 8 + Math.sqrt(z.margine_tot) / 8]).filter((_, j) => j !== i);
    const libero = y => !posti.some(([px, py]) => Math.abs(px - cx) < 90 && Math.abs(py - y) < 18) &&
      !cerchi.some(([qx, qy, qr]) => Math.abs(qx - cx) < 45 + qr && y > qy - qr - 4 && y - 12 < qy + qr);
    const ly = [cy - rr - 8, cy + rr + 16, cy - rr - 24, cy + rr + 32].find(libero) ?? cy - rr - 8; posti.push([cx, ly]); x._ly = ly; });
  it.forEach((x, i) => { s += `<g class="bar" data-t="${x.nome}: ${num(x.venduti)} venduti, margine ${eur(x.margine, 2)}">
      <circle cx="${X(xs[i])}" cy="${Y(ys[i])}" r="${8 + Math.sqrt(x.margine_tot) / 8}" fill="${col[x.classe]}" opacity=".85" style="stroke:var(--card)" stroke-width="2"/>
      <text x="${X(xs[i])}" y="${x._ly}" text-anchor="middle" class="lbl">${x.nome}</text></g>`; });
  s += "</svg>";
  return `<div class="chips">${gruppi.map(g => `<button class="${g === gruppo ? "on" : ""}" onclick="gruppo='${g}';mostra()">${g}</button>`).join("")}</div>
   <div class="grid g2"><div class="card"><h2>Matrice del menu · ${gruppo}</h2><p class="sub">Ultimi 30 giorni, prezzi e costi aggiornati · cerchio più grande = più margine totale</p>${s}</div>
   <div class="card"><h2>Cosa fare</h2><p class="sub">Ordinati per margine totale portato a casa</p><div class="items">
   ${it.map(x => `<div class="item"><h3>${x.nome}<span class="cls ${x.classe}">${x.classe}</span></h3>
      <div class="r"><span>${num(x.venduti)} venduti · ${pct(x.mix)}</span><b style="color:var(--txt)">+${eur(x.margine, 2)}</b></div>
      <div class="r"><span>Prezzo ${eur(x.prezzo, 2)} · costo ${eur(x.costo, 2)}</span><span>food ${pct(x.food)}</span></div>
      <div class="az">→ ${x.azione}</div></div>`).join("")}</div></div></div>`;
}

/* ---------- VISTA 4: SPRECHI ---------- */
function vistaSettimana(soglia) {
  const S = D.settimanale;
  if (!S) return `<div class="card sec"><h2>Conta settimanale · classe A</h2><p class="mut">Nessuna conta ancora. Apri <a href="conta.html">conta.html</a> dal telefono, conta gli ingredienti di classe A e metti il file in <code>dati/inbox/conte</code>.</p></div>`;
  const tot = S.righe.reduce((a, r) => a + Math.max(0, r.valore || 0), 0), mx = Math.max(1, ...S.storico.map(x => x.eccesso));
  const barre = S.storico.map(x => `<div title="${eur(x.eccesso, 0)}" style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px">
     <small class="mut">${eur(Math.round(x.eccesso), 0)}</small><div style="width:70%;height:${Math.max(3, x.eccesso / mx * 90)}px;border-radius:6px 6px 0 0;background:${x.eccesso > 50 ? KO : x.eccesso > 20 ? WARN : OK}"></div>
     <small class="mut">${x.da.slice(8, 10)}/${x.da.slice(5, 7)}</small></div>`).join("");
  return `<div class="grid g2 sec"><div class="card"><h2>Ultima settimana · ingredienti classe A</h2><p class="sub">${S.periodo}</p>
    <div class="big-n" style="color:${tot > 30 ? KO : OK}">${eur(tot)}</div><p class="mut">consumati oltre la ricetta</p>
    <table style="width:100%;border-collapse:collapse;font-size:14px;margin-top:8px"><tr class="mut"><td>Ingrediente</td><td style="text-align:right">Ricetta</td><td style="text-align:right">Usato</td><td style="text-align:right">Scarto</td></tr>
    ${S.righe.map(r => { const ko = r.pct > soglia && r.valore > 10; return `<tr style="border-top:1px solid var(--line, #8883)"><td>${r.ingrediente.replace(/_/g, " ")}</td>
      <td style="text-align:right">${IT.format(Math.round(r.teorico * 10) / 10)} ${r.unita}</td><td style="text-align:right">${IT.format(Math.round(r.reale * 10) / 10)} ${r.unita}</td>
      <td style="text-align:right;font-weight:600;color:${ko ? KO : r.pct > soglia / 2 ? WARN : OK}">${r.pct > 0 ? "+" : ""}${pct(r.pct)} · ${eur(Math.round(r.valore) || 0, 0)}</td></tr>`; }).join("")}</table></div>
    <div class="card"><h2>Andamento settimanale</h2><p class="sub">Euro consumati oltre ricetta tra una conta e l'altra: devono scendere dopo dosatori e porzioni pronte</p>
    <div style="display:flex;gap:6px;height:150px;align-items:stretch">${barre}</div>
    <p class="mut" style="margin-top:12px">Conta ogni settimana, stesso giorno, prima del servizio: <a href="conta.html">apri la pagina della conta</a>.</p></div></div>`;
}

function vistaSprechi() {
  const R = D.consumi.righe.filter(r => r.teorico > 0), maxV = Math.max(...R.map(r => Math.abs(r.valore)));
  const tot = R.reduce((a, r) => a + Math.max(0, r.valore), 0), soglia = D.obiettivi.scostamento_consumi_max;
  return vistaSettimana(soglia) + `<div class="grid g2"><div class="card"><h2>Mese · tutti gli ingredienti</h2><p class="sub">${D.consumi.periodo}</p>
    <div class="big-n" style="color:${tot > 100 ? KO : OK}">${eur(tot)}</div><p class="mut">consumati in più di quanto giustificano le vendite (spreco, porzioni abbondanti, omaggi, ammanchi)</p></div>
    <div class="card"><h2>Come leggerlo</h2><p class="mut" style="line-height:1.6;margin:0">Consumo reale = inventario iniziale + acquisti − inventario finale.<br>Consumo teorico = pizze e piatti venduti × ricetta.<br>
    Barra rossa a destra = consumato più del teorico oltre il ${pct(soglia)} di tolleranza. Un piccolo scostamento è normale (errori di conta).</p></div></div>
    <div class="card sec"><h2>Ingrediente per ingrediente</h2><p class="sub">Differenza in euro: a destra eccesso, a sinistra risparmio</p>
    ${R.map(r => { const l = Math.abs(r.valore) / maxV * 50, ko = r.pct > soglia && r.valore > 20;
      return `<div class="hb"><span>${r.ingrediente.replace(/_/g, " ")}<br><small class="mut">${pct(r.pct)} · ${IT.format(Math.round(r.diff * 10) / 10)} ${r.unita}</small></span>
      <div class="t"><span class="mid"></span><div style="${r.valore >= 0 ? `left:50%;width:${l}%` : `right:50%;width:${l}%`};background:${ko ? KO : r.valore >= 0 ? "#e8b98a" : "#9fcfb3"}"></div></div>
      <b style="text-align:right;color:${ko ? KO : "inherit"}">${eur(Math.round(r.valore) || 0, 0)}</b></div>`; }).join("")}</div>`;
}

/* ---------- VISTA 5: DATI ---------- */
function vistaDati() {
  return `<div class="grid g2"><div class="card"><h2>Qualità dei dati</h2><p class="sub">Da sistemare per avere numeri affidabili</p>
    <ul class="avvisi">${D.qualita.length ? D.qualita.map(q => `<li><span class="dot"></span>${q}</li>`).join("") : "<li>Tutto in ordine.</li>"}</ul></div>
    <div class="card"><h2>Da dove arrivano i numeri</h2><ul class="avvisi">
     <li><span class="dot" style="background:${OK}"></span>Cassa: chiusure serali (vendite, coperti, canali)</li>
     <li><span class="dot" style="background:${OK}"></span>Fatture elettroniche d'acquisto (costi e prezzi aggiornati)</li>
     <li><span class="dot" style="background:${OK}"></span>Presenze: ore lavorate × costo orario</li>
     <li><span class="dot" style="background:${OK}"></span>Inventario di inizio mese</li></ul>
     <p class="mut">Ultimo aggiornamento: ${D.generato}. Calcolato sul PC del locale, nessun dato grezzo esce dal computer.</p></div></div>`;
}

/* ---------- navigazione ---------- */
const VISTE = [["rotta", "Rotta", vistaRotta, "M12 2l3 7 7 3-7 3-3 7-3-7-7-3 7-3z"], ["conto", "Conto", vistaConto, "M4 20V10M10 20V4M16 20v-7M22 20H2"],
  ["menu", "Menu", vistaMenu, "M4 6h16M4 12h16M4 18h10"], ["sprechi", "Sprechi", vistaSprechi, "M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"], ["dati", "Dati", vistaDati, "M12 3a9 9 0 100 18 9 9 0 000-18zM12 8v5M12 16h.01"]];
let vista = (location.hash || "#rotta").slice(1);
function mostra() {
  $("#nav").innerHTML = VISTE.map(([id, n, , ic]) => `<button class="${id === vista ? "on" : ""}" onclick="vista='${id}';location.hash='${id}';mostra();scrollTo(0,0)">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${ic}"/></svg>${n}</button>`).join(" + `<button onclick="location.href='ricettario.html'"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5a2 2 0 012-2h14v16H6a2 2 0 00-2 2zm0 0a2 2 0 002 2h14"/></svg>Ricettario</button>`;
  const v = VISTE.find(x => x[0] === vista) || VISTE[0];
  $("#main").innerHTML = v[2]() + `<footer>⚓ The Galleon · Pub &amp; Pizzeria · Marsciano · aggiornato il ${D.generato}</footer>`;
  animaNumeri();
}
let temaSalvato = null; try { temaSalvato = localStorage.getItem("galleon-tema"); } catch (e) {}
cambiaTema(temaSalvato || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
$("#sottotitolo").textContent = `Dati fino a ${gg(D.ultimo_giorno)} · aggiornato il ${D.generato}`;
window.addEventListener("hashchange", () => { vista = location.hash.slice(1) || "rotta"; mostra(); });
mostra();
</script>
